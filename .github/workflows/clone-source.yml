name: Clone Lottery source into lot-1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/clone-source.yml"

permissions:
  contents: write

jobs:
  clone-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clone source repository and mirror working tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/umar-vai/Lottery-.git /tmp/lottery-source
          rsync -a --delete --exclude='.git/' /tmp/lottery-source/ ./
          rm -f .github/workflows/clone-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Target already matches source."
            exit 0
          fi
          git commit -m "Sync latest Lottery- working tree into lot-1"
          git push origin HEAD:main
